# MD2PDF Web — md2pdf.qiangi.top
# 前端: 127.0.0.1:5002 (vite preview)   后端: 127.0.0.1:8002 (Express)

server {
    server_name md2pdf.qiangi.top;

    # certbot 签发证书时会临时接管这个 server 块
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 250m;

    # 安全响应头（HSTS：强制 HTTPS 180 天；CSP 见下方说明）
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端 API：直连 8002；关闭缓冲以支持 SSE 实时进度
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端静态资源：5002
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/md2pdf.qiangi.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/md2pdf.qiangi.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = md2pdf.qiangi.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name md2pdf.qiangi.top;
    return 404; # managed by Certbot


}